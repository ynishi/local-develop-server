[package]
name = "lds-journal"
description = "Journal module for local-develop-server (lds) — journal-mcp-rmcp SDK consumer forwarding 20 journal tools through a lds ServerHandler composition point"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lds-core = { path = "../core", version = "0.20.0" }
journal-mcp-rmcp = "0.8.0"
anyhow.workspace = true
rmcp.workspace = true
tracing.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
# rustls-tls: the remote daemon is typically reached over https (e.g.
# Fly.io edge TLS); without a TLS backend reqwest fails at send time.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

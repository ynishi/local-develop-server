[package]
name = "lds-outline"
description = "Outline module for local-develop-server (lds) — outline-mcp-rmcp SDK consumer with prefixed tool namespace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
lds-core = { path = "../core", version = "0.20.0" }
outline-mcp-rmcp = "0.10.0"
anyhow.workspace = true
rmcp.workspace = true
tracing.workspace = true
tokio = { workspace = true }
# TLS and nothing else: remote mode talks to an https endpoint, and a build
# without it fails at connect time with `invalid URL, scheme is not http`
# rather than at compile time. `rustls` is what reqwest's own `default-tls`
# resolves to on 0.13; the rest of the default set (charset / http2 /
# system-proxy) stays off, as it was.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
